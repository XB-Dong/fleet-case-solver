name: fleet-ops-lab
services:
  app:
    build:
      context: .
      dockerfile: infra/Dockerfile
    ports: ["127.0.0.1:8765:8765"]
    volumes: ["fleet-data:/app/data"]
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [monitoring, full]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [monitoring, full]
    ports: ["127.0.0.1:9093:9093"]
    volumes: ["./infra/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [monitoring, full]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
  mysql:
    image: mysql:8.4
    profiles: [full]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
      MYSQL_DATABASE: fleet
      MYSQL_USER: fleet
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fleet_local_demo}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql-data:/var/lib/mysql", "./infra/mysql.sql:/docker-entrypoint-initdb.d/fleet.sql:ro"]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    profiles: [full]
    ports: ["127.0.0.1:6380:6379"]
  kafka:
    image: apache/kafka:3.9.1
    profiles: [full]
    ports: ["127.0.0.1:9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
  jobmanager:
    build: ./infra/flink
    profiles: [full]
    command: jobmanager
    ports: ["127.0.0.1:8081:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 1
    volumes: ["./infra/flink/pipeline.sql:/opt/flink/pipeline.sql:ro"]
  taskmanager:
    build: ./infra/flink
    profiles: [full]
    command: taskmanager
    depends_on: [jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1536m
  doris:
    image: apache/doris:4.0.3-all-slim
    profiles: [full]
    ports: ["127.0.0.1:8030:8030", "127.0.0.1:9030:9030"]
    privileged: false
    environment:
      SKIP_CHECK_ULIMIT: 'true'
    ulimits:
      nofile: {soft: 65535, hard: 65535}
    # All-in-one image is a disposable lab node; keep authoritative data in the sandbox.
  business:
    build: ./services/business
    profiles: [full]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fleet?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: fleet
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-fleet_local_demo}
      SPRING_DATA_REDIS_HOST: redis
  bridge:
    build: ./infra/bridge
    profiles: [full]
    depends_on:
      mysql: {condition: service_healthy}
      app: {condition: service_started}
      kafka: {condition: service_started}
      redis: {condition: service_started}
      doris: {condition: service_started}
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fleet_local_demo}
    volumes: ["./infra/doris.sql:/app/doris.sql:ro"]
volumes:
  fleet-data:
  mysql-data:
